name: DuelCoreTestKit
version: 1.0.0
main: top.cheesesmp.duelcore.testkit.TestKitPlugin
api-version: '26.2'
description: Test-only helper that runs headless bot scripts against this server. Do not install on production.
commands:
  dctest:
    description: Run or stop bot scripts
    permission: duelcore.testkit
  tester:
    description: Let a player join while the server is in testing mode
    usage: /tester add <player> | remove <player> | list
    permission: duelcore.tester
permissions:
  duelcore.tester:
    default: op
  duelcore.testkit:
    default: op
