  status-off: "<muted>Animation test mode is <text>off</text>. Turn it on with /animtest on.</muted>"
  needs-on: "<bad>Turn animation test mode on first:</bad> <text>/animtest on</text>"
  unknown-preview: "<bad>No preview <text><preview></text>.</bad> <muted>Try: <previews></muted>"
  playing: "<muted>Playing <text><preview></text>.</muted>"
