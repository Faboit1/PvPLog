    line-overall: "<muted><rank>.</muted> <head> <text><player></text>  <tier> <muted>· <elo> Elo · <wins>W</muted>"
    line-kit: "<muted><rank>.</muted> <head> <text><player></text>  <tier> <muted>· <value> · <wins>W <losses>L</muted>"
    you: "<muted>You · #<rank> · <value></muted>"
    overall-button: "<sprite:items:item/nether_star>"
    overall-button-selected: "<accent>•</accent><sprite:items:item/nether_star>"
    kit-button: "<kit_icon>"
    kit-button-selected: "<accent>•</accent><kit_icon>"
    all-regions: "<muted>All</muted>"
    all-regions-selected: "<accent>All</accent>"
    region: "<muted><region></muted>"
    region-selected: "<accent><region></accent>"
  settings:
