    chat-tags: "Show tier tags in chat"
    hide-hub: "Hide other players in the hub"
    spectators: "Allow spectators in my matches"
    region: "Region"
    region-none: "Not set"
    country: "Country (2 letters)"
    max-ping: "Max opponent ping (0 = any)"
    save: "<good>Save</good>"
    cancel: "<muted>Cancel</muted>"
  spectate:
