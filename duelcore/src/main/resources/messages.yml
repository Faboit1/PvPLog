# The kit editor (Kit Editor hotbar item, /kit edit [kit], /kiteditor [kit]). Look and sounds: gui.yml kit-editor.
kit-editor:
  # Chest title (it stays the same while editing; the Save button glows while there are unsaved changes). <kit>
  title: "Editing · <kit>"
  item:
    save-name: "<good>Save layout</good>"
    save-lore:
      - "<muted>Every match of this kit gives"
      - "<muted>you your items like this."
    reset-name: "<accent>Reset to default</accent>"
    reset-lore:
      - "<muted>Put everything back where the"
      - "<muted>kit has it. Save to keep it."
    clear-name: "<bad>Clear layout</bad>"
    clear-lore:
      - "<muted>Delete your saved layout and"
      - "<muted>use the kit's default again."
    clear-lore-none:
      - "<muted>You're using the kit's default"
      - "<muted>layout (nothing saved)."
    cancel-name: "<bad>Cancel</bad>"
    cancel-lore:
      - "<muted>Close without saving."
    offhand-name: "<text>← Offhand</text>"
    offhand-lore:
      - "<muted>The slot on the left is your offhand."
    info-name: "<accent>Editing <kit></accent>"
    info-lore:
      - "<text>Click an item to pick it up,</text>"
      - "<text>click a slot to put it down or swap.</text>"
      - ""
      - "<muted>Rows 1-3: inventory · Row 4: hotbar</muted>"
      - "<muted>Armour always stays on.</muted>"
      - "<muted>Save when you're done.</muted>"
    # Appended to the (locked) armour pieces.
    locked:
      - "<muted>Locked: armour always stays on</muted>"
    no-armor: "<muted>No <piece></muted>"
    pieces:
      helmet: "helmet"
      chestplate: "chestplate"
      leggings: "leggings"
      boots: "boots"
  # The kit picker dialog. <icon> <name> = the queue menu's tab icon and name of a category (a section header, so
  # it looks different from the kits under it).
  picker:
    title: "Kit Editor"
    header: "<accent>Pick a kit to arrange its items.</accent>"
    category: "<muted>—</muted> <icon> <b><text><name></text></b> <muted>—</muted>"
    kit: "<kit_icon> <text><kit></text>"
    kit-custom: "<kit_icon> <good><kit> ✎</good>"
    separator: "    "
    kit-hover: "<text><description></text><newline><muted>Default layout.</muted><newline><newline><muted>Click to edit.</muted>"
    kit-hover-custom: "<text><description></text><newline><good>✎ Your own layout</good><newline><newline><muted>Click to edit.</muted>"
    footer: "<muted><good>✎</good> = your own layout. Every match of that kit uses it.</muted>"
    no-kits: "<muted>No kits to edit right now.</muted>"
  saved: "<good>✔ Saved your</good> <kit_icon> <text><kit></text> <good>layout.</good> <muted>Every match of this kit uses it.</muted>"
  saved-default: "<good>✔</good> <muted>Using the default layout for</muted> <kit_icon> <text><kit></text><muted>.</muted>"
