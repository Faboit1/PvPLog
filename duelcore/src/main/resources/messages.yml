  result:
    ok: ""
    not_loaded: "<muted>Parties are still loading, try again in a second.</muted>"
    no_profile: "<muted>Your profile is still loading, try again in a second.</muted>"
    in_party: "<muted>You're already in a party. Leave it first with <text>/party leave</text>.</muted>"
    not_in_party: "<muted>You're not in a party.</muted>"
    not_leader: "<muted>Only the party leader can do that.</muted>"
    full: "<muted>That party is full.</muted>"
    offline: "<muted><text><player></text> isn't online.</muted>"
    self: "<bad>You can't do that to yourself."
    target_in_party: "<muted><text><player></text> is already in a party.</muted>"
    already_member: "<muted><text><player></text> is already in your party.</muted>"
    invites_disabled: "<muted><text><player></text> isn't accepting party invites.</muted>"
    already_invited: "<muted>You already invited <text><player></text>.</muted>"
    no_invite: "<muted>No open party invite.</muted>"
    no_party: "<muted>Couldn't find that party. Check the leader's name.</muted>"
    private: "<muted>That party is private. Ask the leader for an invite.</muted>"
