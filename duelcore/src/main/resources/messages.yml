# ─────────────────────────────────────────────────────────────
#  DuelCore — messages (MiniMessage: https://docs.papermc.io/adventure/minimessage/format)
#  No global prefix. Colours come from the theme below and are used as tags: <accent>…</accent>
#  Set a message to "" to disable it.
#  Sprites: <sprite:items:item/mace>  <sprite:gui:hud/heart/full>   Heads: <head:Notch>
# ─────────────────────────────────────────────────────────────
theme:
  accent: "#f2c14e"
  text: "#e6e6e6"
  muted: "#8b9099"
  good: "#7fd99a"
  bad: "#ff7a7a"

mode:
  ranked: "ranked"
  unranked: "unranked"
  party: "2v2"

hub:
  join-message: ""
  quit-message: ""
  welcome: "<muted>Welcome, <text><player></text>. Right-click <text>Play</text> to find a match.</muted>"
  # Title on joining (config.yml animations.join-title).
  join-title: "<#f2c14e>Cheese</#f2c14e> <#f7e3a1>PvP</#f7e3a1>"
  join-subtitle: "<muted>Ranked duels</muted>"
  # The typed welcome title instead (config.yml animations.join-welcome). <player>; in welcome-subtitle also <tier>
  # (icon + tier of the best kit), <overall> (overall tier) and <elo> (overall Elo).
  welcome-back-title: "<text>Welcome back,</text> <accent><player></accent>"
  welcome-first-title: "<text>Welcome to</text> <#f2c14e>Cheese</#f2c14e> <#f7e3a1>PvP</#f7e3a1>"
  welcome-subtitle: "<tier> <muted>· <elo> Elo</muted>"
  # First join, or nothing ranked yet.
  welcome-subtitle-unranked: "<muted>Right-click</muted> <text>Play</text> <muted>to find a match</muted>"
  # Short action bar pops next to the friend and party chat alerts (config.yml animations.alert-pops). "" = none.
  alerts:
    friend-online: "<good>●</good> <text><player></text> <muted>is online</muted>"
    followed-you: "<accent>+</accent> <text><player></text> <muted>followed you</muted>"
    now-friends: "<good>♥</good> <muted>You and</muted> <text><player></text> <muted>are friends</muted>"
    party-invite: "<accent>✉</accent> <text><player></text> <muted>invited you to their party</muted>"
    party-joined: "<good>+</good> <text><player></text> <muted>joined the party</muted>"
    you-joined: "<good>✔</good> <muted>You joined</muted> <text><leader></text><muted>'s party</muted>"

command:
  no-permission: "<bad>You can't do that."
  unknown-kit: "<bad>Unknown kit <text><kit></text>."

queue:
  joined: "<muted>Searching</muted> <kit_icon> <text><kit></text> <muted>· <mode></muted>"
  switched: "<muted>Switched to</muted> <kit_icon> <text><kit></text> <muted>· <mode></muted>"
  left: "<muted>Left the queue.</muted>"
  not-queued: "<muted>You're not in a queue.</muted>"
  # Action bar while queued. <kit> is "<count> kits" (kit-count) when searching several; <kit_icon> shows them all.
  searching: "<kit_icon> <text><kit></text> <muted>· <wait> · ±<range></muted>"
  kit-count: "<count> kits"
  # The animated action bar (config.yml animations.searching-bar). Extra tags: <spinner>, and <searching> (the word
  # below with pulsing dots); both slowly change colour (gui.yml searching).
  searching-animated: "<spinner> <searching> <kit_icon> <text><kit></text> <muted>· <wait> · ±<range></muted>"
  searching-word: "Searching"
  # Keep Queuing re-joined the kits a player searched for before their match.
  requeued: "<muted>Searching again:</muted> <kit_icon>"
  result:
    ok: ""
    switched: ""
    already: "<muted>You're already searching for <text><kit></text>.</muted>"
    in_match: "<bad>Finish your match first."
    spectating: "<bad>Stop spectating first."
    kit_disabled: "<bad>That kit is disabled right now."
    mode_disabled: "<bad>That queue is closed right now."
    not_loaded: "<muted>Your profile is still loading, try again in a second.</muted>"
    party: "<bad>Use /party queue while you're in a party."

match:
  found-title: "<accent>Match found</accent>"
  found-subtitle: "<kit_icon> <text><opponent></text> <muted>· <tier> · <mode></muted>"
  # Animated "match found" (config.yml animations.match-found-reveal): this sweeps in with a shimmer in its first
  # colour, then found-subtitle is typed out.
  found-reveal: "<accent>MATCH FOUND</accent>"
  countdown: "<text><seconds></text>"
  countdown-sub: "<muted>Round <round> · first to <first_to></muted>"
  fight: "<accent>Fight</accent>"
  death: "<muted><text><victim></text> died.</muted>"
  death-by: "<muted><text><victim></text> was killed by <text><killer></text><hearts></muted>"
  hearts: "<muted> · <bad><hp>❤</bad></muted>"
  timeout: "<muted>Time's up. The healthier side takes the round.</muted>"
  round-won: "<good>Round won</good> <muted>· <you>–<opp></muted>"
  round-lost: "<bad>Round lost</bad> <muted>· <you>–<opp></muted>"
  round-draw: "<muted>Round drawn · <you>–<opp></muted>"
  round-spectator: "<muted>Round <round> → <text><winner></text> · <you>–<opp></muted>"
  out-of-bounds: "<bad>Stay inside the arena.</bad>"
  opponent-quit: "<muted><text><player></text> left the match and forfeits.</muted>"
  opponent-forfeit: "<muted><text><player></text> forfeited.</muted>"
  # A ranked opponent's connection dropped and one of their disconnect saves voided the match.
  # /leave before the first fight: the match ends with no result. <left> = early leaves left before it's a forfeit.
  left-before-start: "<muted>You left before the fight started. No result.</muted> <text><left></text><muted> more early leaves in a row are allowed.</muted>"
  opponent-left-before-start: "<muted><text><player></text> left before the fight started. No result, no Elo change.</muted>"
  opponent-connection-lost: "<muted><text><player></text> lost connection. No result, no Elo change.</muted>"
  # Told on the next join after a saved drop. <left> of <per_day> saves are left today.
  connection-saved: "<muted>Your connection dropped in a ranked match: no Elo lost.</muted> <text><left></text><muted>/<per_day> disconnect saves left today.</muted>"
  forfeit-confirm: "<muted>Type <text>/leave</text> again within 5 seconds to forfeit. It counts as a loss.</muted>"
  forfeited: "<muted>You forfeited the match.</muted>"
  # Action bar while a new arena is being built for the match.
  preparing-arena: "<muted>Preparing your arena…</muted>"
  # A double kill (both died at the same time, see match.trade in config.yml) drew the round. <left> = draws left
  # before a double kill is decided by a coin flip.
  trade-draw: "<muted>Double kill! The round is a draw.</muted> <text><left></text><muted> more double-kill draws this match.</muted>"
  trade-coin: "<muted>Double kill again: a coin flip gives the round to <text><winner></text>.</muted>"
  draw:
    # To the one offering / the opponent. <player> <seconds> <accept> <deny>
    offered: "<muted>Draw offered to <text><player></text>. It expires in <seconds>s.</muted>"
    received: "<text><player></text> <muted>offers a draw (no Elo change).</muted>  <accept> <deny>"
    accept-button: "<good>[Accept]</good>"
    deny-button: "<muted>[Decline]</muted>"
    agreed: "<muted>Both players agreed to a draw. No Elo change.</muted>"
    denied: "<muted><text><player></text> declined your draw offer.</muted>"
    you-denied: "<muted>Draw offer declined.</muted>"
    no-offer: "<muted>There's no draw offer to decline.</muted>"
    already-offered: "<muted>Your draw offer is still waiting for an answer.</muted>"
    cooldown: "<muted>You can offer a draw again in <seconds>s.</muted>"
    not-in-match: "<muted>You're not in a match.</muted>"
    only-1v1: "<muted>Draws can only be offered in 1v1 matches.</muted>"
    disabled: "<muted>Draw offers are turned off.</muted>"
  command-blocked: "<muted>You can't use that command during a match.</muted>"
  cancelled: "<muted>The match was cancelled. Nothing was rated.</muted>"
  # Settings → Auto GG: said for the player to their match (fighters and spectators) a second after it ends.
  auto-gg: "<muted>[Match]</muted> <text><player></text><muted>:</muted> gg"
  no-arena: "<bad>No arena was free for your match. Nothing was rated, you can queue again."
  # In-match animations (config.yml animations; colours in gui.yml match-fx).
  fx:
    # Plain text: the colours are the gradient in gui.yml match-fx.fight-colors.
    fight: "FIGHT!"
    # Round banner title and score; <you>/<opp> pop when they change (spectators: team 1 / team 2).
    round-won: "<good><b>ROUND WON</b></good>"
    round-lost: "<bad><b>ROUND LOST</b></bad>"
    round-draw: "<muted><b>ROUND DRAWN</b></muted>"
    round-spectator: "<text><winner></text> <muted>takes round <round></muted>"
    round-score: "<text><you></text> <muted>—</muted> <text><opp></text>"
    # Countdown subtitle when <team> is one round from winning, or when every side is.
    match-point: "<bad>Match point</bad> <muted>· <text><team></text></muted>"
    final-round: "<bad>Final round</bad> <muted>· round <round></muted>"
    combo: "<accent><count></accent> <muted>hit combo</muted>"
    kill: "<good>+1</good> <text>kill</text><combo>"
    kill-combo: " <muted>·</muted> <accent><count></accent> <muted>hit combo</muted>"
    # Low health; <hp> is in hearts. The colour pulses (gui.yml match-fx.heartbeat-colors).
    heartbeat: "❤ <hp>"
    players-left: "<text><count></text> <muted>players left</muted>"
    # Spectators at the end of a match. <first>/<second>: the two teams' scores.
    spectator-winner: "<accent><winner></accent>"
    spectator-winner-sub: "<muted>wins · <first>–<second></muted>"
    spectator-winner-sub-ffa: "<muted>wins the Party FFA</muted>"
    spectator-draw: "<muted>Draw</muted>"
    spectator-draw-sub: "<muted><first>–<second></muted>"

results:
  title-victory: "<good>Victory</good>"
  title-defeat: "<bad>Defeat</bad>"
  title-draw: "<muted>Draw</muted>"
  word-victory: "<good>Victory</good>"
  word-defeat: "<bad>Defeat</bad>"
  word-draw: "<muted>Draw</muted>"
  subtitle: "<text><you>–<opp></text> <muted>vs <opponent></muted>"
  chat: "<kit_icon> <outcome> <text><you_score>–<opp_score></text> <muted>vs <opponent></muted>"
  chat-rating: "<muted>Rating <text><after></text> (<delta>) · <tier></muted>"
  header: "<kit_icon> <text><kit></text> <muted>· <mode></muted>"
  score: "<text><you></text> <accent><you_score> – <opp_score></accent> <text><opponent></text>"
  forfeit: "<muted>Ended by forfeit.</muted>"
  connection-lost: "<muted>A connection dropped: no result, no Elo change.</muted>"
  agreed-draw: "<muted>Draw agreed: no Elo change.</muted>"
  stat-hits: "<muted>Hits</muted>  <text><you></text> <muted>· <opp></muted>"
  stat-damage: "<muted>Damage</muted>  <text><you>❤</text> <muted>· <opp>❤</muted>"
  stat-combo: "<muted>Best combo</muted>  <text><you></text> <muted>· <opp></muted>"
  stat-rounds: "<muted>Rounds</muted>  <rounds>"
  round-win: "<good>W</good>"
  round-loss: "<bad>L</bad>"
  round-draw: "<muted>D</muted>"
  rating-up: "<muted>Rating</muted>  <text><before> → <after></text> <good><delta></good>"
  rating-down: "<muted>Rating</muted>  <text><before> → <after></text> <bad><delta></bad>"
  tier: "<muted>Tier</muted>  <before> <muted>→</muted> <after>"
  spectator: "<muted>Match over · <text><winner></text> wins <red_score>–<blue_score> · <kit></muted>"
  nobody: "nobody"

duel:
  received: "<kit_icon> <text><player></text> <muted>challenged you to</muted> <text><kit></text>  <accept> <deny>"
  accept-button: "<good>Accept</good>"
  deny-button: "<muted>Decline</muted>"
  sent: "<muted>Challenge sent to <text><player></text> · <kit_icon> <kit>. It expires in 60s.</muted>"
  denied: "<muted><text><player></text> declined your challenge.</muted>"
  expired: "<muted>Your challenge expired.</muted>"
  result:
    sent: ""
    accepted: ""
    self: "<bad>You can't duel yourself."
    offline: "<bad>That player isn't online."
    disabled_by_target: "<muted><text><player></text> isn't accepting challenges.</muted>"
    friends_only: "<muted><text><player></text> only accepts challenges from friends.</muted>"
    busy: "<bad>Finish your match first."
    target_busy: "<muted><text><player></text> is in a match.</muted>"
    already_sent: "<muted>You already challenged <text><player></text>.</muted>"
    no_request: "<muted>No open challenge.</muted>"

spectate:
  started: "<muted>Spectating <text><red></text> vs <text><blue></text> · <kit>. Use the dye or /leave to stop.</muted>"
  # Party FFA (one team per player): <players> fighters, <alive> still standing this round.
  started-ffa: "<muted>Spectating a <text>Party FFA</text> · <players> players · <alive> alive · <kit>. Use the dye or /leave to stop.</muted>"
  ended: "<muted>That match already ended.</muted>"
  not-spectating: "<muted>You're not spectating.</muted>"
  result:
    ok: ""
    not_in_match: "<muted><text><player></text> isn't in a match.</muted>"
    self: "<bad>You can't spectate yourself."
    busy: "<bad>Finish your match first."
    disallowed: "<muted><text><player></text> doesn't allow spectators.</muted>"
    no_arena: "<muted>That match is still starting, try again in a second.</muted>"

chat:
  blocked: "<bad>Your message was blocked: it contains a slur or harassment.</bad>"
  blocked-staff: "<muted>[filter]</muted> <text><player></text> <muted>tried to say</muted> <text><message></text> <muted>(<term>)</muted>"

friends:
  # Chat. <player> is the other player's name.
  loading: "<muted>Your friends list is still loading, try again in a second.</muted>"
  error: "<bad>That didn't work, please try again."
  not-found: "<muted>No player called <text><player></text> has played here.</muted>"
  self: "<bad>You can't follow yourself."
  already-following: "<muted>You already follow <text><player></text>.</muted>"
  not-following: "<muted>You don't follow <text><player></text>.</muted>"
  limit: "<bad>You can follow at most <max> players. Unfollow someone first."
  followed: "<muted>You now follow <text><player></text>. If they follow you back, you're friends.</muted>"
  unfollowed: "<muted>You unfollowed <text><player></text>.</muted>"
  now-friends: "<good>You and <text><player></text> are now friends.</good>"
  # Sent to the followed player (Settings → Friend alerts). <follow_back> is the button below.
  followed-you: "<text><player></text> <muted>followed you.</muted> <follow_back>"
  follow-back-button: "<good>[Follow back]</good>"
  follow-back-hover: "<muted>Follow <text><player></text> back to become friends</muted>"
  online: "<good>●</good> <muted>Your friend <text><player></text> is online.</muted>"
  offline: "<muted>● Your friend <text><player></text> went offline.</muted>"
  # On join, when friends are online. <names> = up to 8 names.
  online-summary: "<muted>Friends online (<text><count></text>): <text><names></text></muted>"
  not-free: "<muted><text><player></text> can't duel right now.</muted>"
  list-header: "<accent>Friends</accent> <muted>· <text><online></text> online · <total> friends · <following> following · <followers> followers</muted>"
  list-empty: "<muted>No friends yet. Follow someone with <text>/follow <name></text>; when they follow back you're friends.</muted>"
  list-online: "<good>●</good> <text><player></text><status>"
  list-offline: "<muted>● <player></muted>"
  list-in-match: " <muted>· in a match</muted>"
  dialog:
    title: "Friends"
    # <filter> is one of the filter names below; <shown> = people matching the filter.
    body: "<muted>Page <text><page>/<pages></text> | <text><filter></text> | <text><shown></text> shown</muted>"
    empty-all: "<muted>Nobody yet. Use Add Friends to follow players; when they follow back you're friends.</muted>"
    empty-friends: "<muted>No friends yet. Friends are players who follow you back.</muted>"
    empty-following: "<muted>You don't follow anyone yet.</muted>"
    empty-followers: "<muted>Nobody follows you yet.</muted>"
    prev: "<muted>\\<</muted>"
    prev-tooltip: "<muted>Previous page</muted>"
    next: "<muted>></muted>"
    next-tooltip: "<muted>Next page</muted>"
    add: "<good>Add Friends</good>"
    add-tooltip: "<muted>Search online players</muted>"
    refresh: "<#66f7ff>Refresh</#66f7ff>"
    refresh-tooltip: "<muted>Reload friendships</muted>"
    filter: "<#66f7ff>Filter: <filter></#66f7ff>"
    filter-tooltip: "<muted>All | Friends | Following | Followers</muted>"
    filter-all: "All"
    filter-friends: "Friends"
    filter-following: "Following"
    filter-followers: "Followers"
    # One button per person. <head> <player>; <suffix> = add-back for followers you don't follow back.
    person-online: "<good>●</good> <head> <text><player></text><suffix>"
    person-in-match: "<accent>⚔</accent> <head> <text><player></text><suffix>"
    person-offline: "<muted>●</muted> <head> <muted><player></muted><suffix>"
    add-back: " <muted>·</muted> <good>Add Back</good>"
    # Tooltips. <status> = one of the status lines below.
    tooltip-mutual: "<muted>Mutual friends | Open profile</muted><newline><status>"
    tooltip-following: "<muted>Following | Open profile</muted><newline><status>"
    tooltip-follower: "<good>Follows you | Add Back</good><newline><status>"
    status-online: "<good>Online</good>"
    status-in-match: "<accent>In a match</accent> <muted>· <kit></muted>"
    status-offline: "<muted>Offline</muted>"
  person:
    title: "<player>"
    header: "<head> <text><player></text>  <status>"
    mutual: "<muted>Friends · you follow each other</muted>"
    following: "<muted>You follow <player>. They don't follow you back yet.</muted>"
    follower: "<muted><player> follows you. Follow back to become friends.</muted>"
    since: "<muted>Following for <text><ago></text></muted>"
    profile: "<text>Open profile</text>"
    follow-back: "<good>Follow back</good>"
    unfollow: "<bad>Unfollow</bad>"
    duel: "<text>Duel</text>"
    spectate: "<text>Spectate</text>"
    back: "<muted>Back</muted>"
  add:
    title: "Add Friends"
    body: "<muted>Online players you don't follow yet. Showing <text><shown></text> of <text><total></text>.</muted>"
    no-results: "<muted>No online player matches <text><query></text>. Use Follow to add an offline player by exact name.</muted>"
    none: "<muted>Nobody else is online that you don't follow already.</muted>"
    search-label: "Search players"
    search: "<text>Search</text>"
    back: "<muted>Back</muted>"
    player: "<head> <text><player></text>"
    player-tooltip: "<muted>Follow <text><player></text></muted>"
    by-name: "<good>Follow <player></good>"
    by-name-tooltip: "<muted>Follow <text><player></text> by exact name (works offline)</muted>"
  # Profile dialog, when viewing someone else.
  profile:
    follow: "<good>Follow</good>"
    follow-back: "<good>Follow back</good>"
    unfollow: "<muted>Unfollow</muted>"

profile:
  not-found: "<muted>No profile for <text><player></text>.</muted>"
  no-legacy: "<muted>There is no previous season yet.</muted>"

# Parties (/party, /pc, the party hub item). Layout knobs are in gui.yml (party-menu), limits in config.yml (party).
party:
  # Party chat: "@message", /pc <message>, or every message while Party Chat is on. <name> <message>
  chat-format: "<accent>[Party]</accent> <text><name></text><muted>:</muted> <message>"
  chat-on: "<muted>Party chat <good>on</good>: everything you type goes to your party. <text>/party chat</text> turns it off.</muted>"
  chat-off: "<muted>Party chat <bad>off</bad>. Start a message with <text>@</text> or use <text>/pc</text> to talk to your party.</muted>"
  created: "<muted>Party created. Invite players from the party menu or with <text>/party invite</text>.</muted>"
  # To the invited player. <head> <player> (who invited) <size> <max> <seconds> <accept> <deny>
  invite-received: "<head> <text><player></text> <muted>invited you to their party (<size>/<max>).</muted>  <accept> <deny>"
  accept-button: "<good>[Accept]</good>"
  deny-button: "<bad>[Deny]</bad>"
  invite-sent: "<muted>Invited <text><player></text>. The invite expires in <seconds>s.</muted>"
  invite-expired: "<muted>Your party invite to <text><player></text> expired.</muted>"
  invite-denied: "<muted><text><player></text> declined your party invite.</muted>"
  denied: "<muted>Declined.</muted>"
  you-joined: "<muted>You joined <text><leader></text>'s party (<size>/<max>). Talk to it with <text>@message</text>.</muted>"
  you-left: "<muted>You left the party.</muted>"
  you-kicked: "<muted>You were removed from <text><leader></text>'s party.</muted>"
  you-disbanded: "<muted>You disbanded the party.</muted>"
  welcome-back: "<muted>You're in <text><leader></text>'s party · <online>/<size> online · <text>/party</text></muted>"
  # Shown on the next join to players who were removed while offline. <leader>
  notice-kicked: "<muted>While you were away, <text><leader></text> removed you from their party.</muted>"
  notice-disbanded: "<muted>While you were away, <text><leader></text> disbanded your party.</muted>"
  # Sent to the online party members. <player> (and <inviter> for invited)
  notify:
    joined: "<muted><text><player></text> joined the party.</muted>"
    left: "<muted><text><player></text> left the party.</muted>"
    kicked: "<muted><text><player></text> was removed from the party.</muted>"
    online: "<muted><text><player></text> is online.</muted>"
    offline: "<muted><text><player></text> went offline.</muted>"
    leader: "<muted><text><player></text> is now the party leader.</muted>"
    disbanded: "<muted><text><player></text> disbanded the party.</muted>"
    invited: "<muted><text><inviter></text> invited <text><player></text> to the party.</muted>"
    open: "<muted>The party is now <good>open</good>: anyone can join it from the party menu.</muted>"
    private: "<muted>The party is now <accent>private</accent>: invite or password only.</muted>"
    password-set: "<muted>The party now asks a password from players who join without an invite.</muted>"
    password-cleared: "<muted>The party password was removed.</muted>"
  # Party vs Party. <leader> <count> (online members) <kit> <kit_icon> <seconds> <accept> <deny>
  challenge-received: "<kit_icon> <text><leader></text><muted>'s party (<count> online) challenges yours to</muted> <text><kit></text><muted>.</muted>  <accept> <deny>"
  challenge-sent: "<muted>Challenged <text><leader></text>'s party to</muted> <kit_icon> <text><kit></text><muted>. They have <seconds>s to accept.</muted>"
  challenge-expired: "<muted>Your party challenge to <text><leader></text> expired.</muted>"
  challenge-denied: "<muted><text><leader></text> declined your party challenge.</muted>"
  # To the whole party when a party match is over. <kit> <kit_icon> <winner> <loser> <winner_score> <loser_score>
  result-ffa: "<kit_icon> <muted>Party FFA over ·</muted> <text><winner></text> <muted>is the last one standing.</muted>"
  result-split: "<kit_icon> <muted>Party duel over ·</muted> <text><winner></text> <muted>won <winner_score>–<loser_score>.</muted>"
  result-pvp: "<kit_icon> <muted>Party vs party over ·</muted> <text><winner></text><muted>'s party beat</muted> <text><loser></text><muted>'s, <winner_score>–<loser_score>.</muted>"
