# Post-match progress (config.yml animations): the hub action bar counts up, then blinks and fades out.
progress:
  # During placement: <percent> counts up to what this match added, <bar> fills (gui.yml progress-reveal.bar).
  placement: "<good>+<percent>%</good> <text>towards your tier</text>  <bar>"
  # Once placed: <delta> counts up to the change, <after> counts from <before> to the new rating.
  elo-up: "<good>+<delta> Elo</good>  <muted><before> →</muted> <text><after></text>"
  elo-down: "<bad>−<delta> Elo</bad>  <muted><before> →</muted> <text><after></text>"
  elo-same: "<muted>±0 Elo  <after></muted>"
  # Titles. <tier> is the new tier in its tiers.yml colour (shimmering in the title), <kit> the kit.
  tier-up-title: "<tier>"
  tier-up-subtitle: "<good>Tier up</good> <muted>· <kit></muted>"
  placed-title: "<text>Placed:</text> <tier><text>!</text>"
  placed-subtitle: "<muted>Your first tier in <kit></muted>"
  # Demotion: only a subtitle. <before> and <after> are the tiers.
  tier-down-subtitle: "<muted><kit> ·</muted> <before> <muted>→</muted> <after>"

