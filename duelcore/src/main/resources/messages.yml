  auto-save-failed: "<bad>Match found:</bad> <muted>your</muted> <kit_icon> <text><kit></text> <muted>layout could not be saved; the last one is used.</muted>"
  discarded: "<muted>Closed the</muted> <text><kit></text> <muted>editor without saving.</muted>"
  reset-done: "<accent>Default layout</accent> <muted>· Save to keep it</muted>"
  cleared: "<muted>Cleared your</muted> <text><kit></text> <muted>layout: the default is used again.</muted>"
  already-default: "<muted>You're already using the default</muted> <text><kit></text> <muted>layout.</muted>"
  invalid: "<bad>Every item of the kit must be placed before saving.</bad>"
  save-failed: "<bad>Could not save the layout right now. Try again in a moment.</bad>"
