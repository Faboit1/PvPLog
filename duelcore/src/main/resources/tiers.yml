# ─────────────────────────────────────────────────────────────
#  Tiers: HT1 > MT1 > LT1 > HT2 > MT2 > LT2 > HT3 > MT3 > LT3 > HT4 > MT4 > LT4 > HT5 > MT5 > LT5
#  After changing thresholds, points or the overall mode run /duelcore season recalc to rebuild the standings.
# ─────────────────────────────────────────────────────────────

# Ranked games a player needs in a kit before a tier shows (until then: unranked-label).
placement-matches: 5
unranked-label: "???"

# Minimum per-kit rating for each tier. "default" applies to every kit; add a kit id below to override.
kit-thresholds:
  default:
    HT1: 2000
    MT1: 1900
    LT1: 1800
    HT2: 1700
    MT2: 1620
    LT2: 1550
    HT3: 1480
    MT3: 1410
    LT3: 1350
    HT4: 1290
    MT4: 1230
    LT4: 1170
    HT5: 1110
    MT5: 1050
    LT5: 0
  # mace:
  #   HT1: 2100
  # "overall" overrides the thresholds used for the overall tier (overall-mode: elo).
  # overall:
  #   HT1: 1950

# How the overall ranking works:
#   elo    - overall Elo = average rating of every kit the player finished placement in. The overall tier uses the
#            thresholds above (kit-thresholds.overall if present, otherwise default). Leaderboards sort by it.
#   points - legacy: every kit tier adds tier-points to a global total; the overall tier uses overall-thresholds.
overall-mode: elo

# overall-mode: points only. Points a kit tier adds to the global total.
tier-points:
  HT1: 60
  MT1: 50
  LT1: 45
  HT2: 40
  MT2: 32
  LT2: 28
  HT3: 22
  MT3: 16
  LT3: 12
  HT4: 8
  MT4: 5
  LT4: 3
  HT5: 2
  MT5: 1
  LT5: 0

# overall-mode: points only. Overall tier from global points (sum of the kit tier points).
overall-thresholds:
  HT1: 400
  MT1: 350
  LT1: 300
  HT2: 250
  MT2: 200
  LT2: 150
  HT3: 125
  MT3: 100
  LT3: 75
  HT4: 50
  MT4: 30
  LT4: 15
  HT5: 5
  MT5: 1
  LT5: 0

# How each tier is drawn (MiniMessage). <tier> is the tier name. Kept subtle on purpose.
format:
  HT1: "<#f2c14e><tier></#f2c14e>"
  MT1: "<#f2c14e><tier></#f2c14e>"
  LT1: "<#f2c14e><tier></#f2c14e>"
  HT2: "<#d9a7ff><tier></#d9a7ff>"
  MT2: "<#d9a7ff><tier></#d9a7ff>"
  LT2: "<#d9a7ff><tier></#d9a7ff>"
  HT3: "<#8ec5ff><tier></#8ec5ff>"
  MT3: "<#8ec5ff><tier></#8ec5ff>"
  LT3: "<#8ec5ff><tier></#8ec5ff>"
  HT4: "<#9ee6b8><tier></#9ee6b8>"
  MT4: "<#9ee6b8><tier></#9ee6b8>"
  LT4: "<#9ee6b8><tier></#9ee6b8>"
  HT5: "<#c9ccd1><tier></#c9ccd1>"
  MT5: "<#c9ccd1><tier></#c9ccd1>"
  LT5: "<#c9ccd1><tier></#c9ccd1>"
  unranked: "<#6b7078><tier></#6b7078>"
