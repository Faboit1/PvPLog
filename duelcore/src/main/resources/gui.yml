# ─────────────────────────────────────────────────────────────
#  DuelCore — visuals: hub hotbar, sidebar, tier tags and dialog layout.
#  Colours come from the theme in messages.yml: <accent> <text> <muted> <good> <bad>.
#  Sprites: <sprite:items:item/mace>, <sprite:gui:hud/heart/full>, <sprite:blocks:block/obsidian>
# ─────────────────────────────────────────────────────────────

# Hub hotbar. Items can't be moved or dropped. "player_head" shows the player's own skin.
hotbar:
  queue:
    slot: 0
    item: netherite_sword
    name: "<text>Play</text>"
    lore:
      - "<muted>Pick a kit and find a match"
  leave-queue:
    slot: 0
    item: gray_dye
    name: "<bad>Leave queue</bad>"
    lore:
      - "<muted>Stop searching"
  leaderboard:
    slot: 2
    item: nether_star
    name: "<text>Leaderboards</text>"
    lore:
      - "<muted>Top players, overall and per kit"
  profile:
    slot: 4
    item: player_head
    name: "<text>Profile</text>"
    lore:
      - "<muted>Your tiers, stats and history"
  settings:
    slot: 6
    item: comparator
    name: "<text>Settings</text>"
    lore:
      - "<muted>Region, ping, sidebar, requests"
  spectate:
    slot: 8
    item: ender_eye
    name: "<text>Spectate</text>"
    lore:
      - "<muted>Watch a live match"
  # Given to spectators instead of the hub items.
  stop-spectating:
    slot: 8
    item: gray_dye
    name: "<bad>Stop spectating</bad>"
    lore:
      - "<muted>Back to the hub"

# Server list entry. Placeholders: <online> <max> <live> (matches) <fighting> <queued> <kits>
motd:
  enabled: true
  # Center each line in the server list (by character widths of the default font).
  center: true
  lines:
    - "<#f2c14e>Cheese</#f2c14e> <#f7e3a1>PvP</#f7e3a1>"
    - "<#8b9099>Ranked duels</#8b9099> <#4b4f57>·</#4b4f57> <#8b9099><kits> kits</#8b9099> <#4b4f57>·</#4b4f57> <#d8dbe0><live></#d8dbe0> <#8b9099>live</#8b9099>"
  # Replaces the player list shown when hovering the player count. Empty list = the normal player list.
  hover:
    - "<#f2c14e>Cheese PvP</#f2c14e>"
    - "<#8b9099>Fighting</#8b9099> <#d8dbe0><fighting></#d8dbe0>"
    - "<#8b9099>In queue</#8b9099> <#d8dbe0><queued></#d8dbe0>"

sidebar:
  enabled: true
  title: "<accent>Duels</accent>"
  # Placeholders: <player> <tier> <elo> (overall Elo) <queued> <live> <online> <region> <ping>
  hub:
    - ""
    - "<text><player></text>"
    - "<tier> <muted>· <elo> Elo</muted>"
    - ""
    - "<muted>Queued</muted>  <text><queued></text>"
    - "<muted>Live</muted>  <text><live></text>"
    - ""
    - "<muted>cheesesmp.top</muted>"
  # Extra: <kit> <kit_icon> <mode> <wait> <range>
  queue:
    - ""
    - "<text><player></text>"
    - "<tier> <muted>· <elo> Elo</muted>"
    - ""
    - "<kit_icon> <text><kit></text> <muted><mode></muted>"
    - "<muted>Searching</muted>  <text><wait></text>"
    - "<muted>Range</muted>  <text>±<range></text>"
    - ""
    - "<muted>cheesesmp.top</muted>"
  # Extra: <kit> <kit_icon> <mode> <opponent> <you_score> <opp_score> <round> <first_to> <time> <ping> <opp_ping>
  match:
    - ""
    - "<kit_icon> <text><kit></text> <muted><mode></muted>"
    - ""
    - "<text>You</text>  <accent><you_score></accent>"
    - "<text><opponent></text>  <accent><opp_score></accent>"
    - "<muted>First to <first_to> · round <round></muted>"
    - ""
    - "<muted>Time</muted>  <text><time></text>"
    - "<muted>Ping</muted>  <text><ping></text> <muted>/ <opp_ping></muted>"
    - ""
    - "<muted>cheesesmp.top</muted>"
  # Extra: <kit> <kit_icon> <red_name> <blue_name> <red_score> <blue_score> <round> <time>
  spectate:
    - ""
    - "<kit_icon> <text><kit></text> <muted>spectating</muted>"
    - ""
    - "<text><red_name></text>  <accent><red_score></accent>"
    - "<text><blue_name></text>  <accent><blue_score></accent>"
    - "<muted>Round <round></muted>"
    - ""
    - "<muted>Time</muted>  <text><time></text>"
    - ""
    - "<muted>cheesesmp.top</muted>"

# Tier tags. <tier> = the formatted overall tier (tiers.yml → format), <name> = player name.
tags:
  chat: "<tier> <text><name></text><muted>:</muted> <message>"
  tab: "<tier> <text><name></text>"
  nametag-prefix: "<tier> "
  # Hide the tag for players who have no ranked kit yet (instead of showing "???").
  hide-unranked: false

dialogs:
  # Columns in the kit picker and leaderboard kit list.
  kit-columns: 3
  kit-button-width: 110
  wide-width: 310
  # Lines shown on the leaderboard page.
  leaderboard-lines: 10
  # Most live matches listed in the spectate menu (after search and sort).
  spectate-limit: 30
  # Recent matches on the profile page.
  history-lines: 5
